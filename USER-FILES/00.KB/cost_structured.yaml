# FAL.ai Video Generation Model Pricing
# All prices in USD

models:

  hailiuo2:
    standard:
    - name: "Hailiuo2-Std"
      resolution: "768p"
      price_per_second: 0.045
      example_6s_video: 0.27

    - name: "Hailiuo2-Std"
      resolution: "512p"
      price_per_second: 0.017
      example_6s_video: 0.102

    speed:
    - name: "Hailiuo2-Speed"
      resolution: "512p"
      price_per_second: 0.017
      example_6s_video: 0.102

    pro:
    - name: "Hailiuo2-Pro"
      resolution: "default"
      price_per_second: 0.08
      example_6s_video: 0.48

  seedance:
    pro:
    - name: "Seedance-Pro"
      resolution: "1080p"
      duration: "5s"
      price_per_video: 0.62
      price_per_million_tokens: 2.5
      token_formula: "(height x width x FPS x duration) / 1024"

    - name: "Seedance-Pro"
      resolution: "720p"
      duration: "5s"
      price_per_million_tokens: 2.5
      token_formula: "(height x width x FPS x duration) / 1024"
      estimated_price: 0.28 # Calculated based on resolution

    - name: "Seedance-Pro"
      resolution: "512p"
      duration: "5s"
      price_per_million_tokens: 2.5
      token_formula: "(height x width x FPS x duration) / 1024"
      estimated_price: 0.14 # Calculated based on resolution

    lite:
    - name: "Seedance-Lite"
      resolution: "720p"
      duration: "5s"
      price_per_video: 0.18
      price_per_million_tokens: 1.8
      token_formula: "(height x width x FPS x duration) / 1024"

    - name: "Seedance-Lite"
      resolution: "1080p"
      duration: "5s"
      price_per_million_tokens: 1.8
      token_formula: "(height x width x FPS x duration) / 1024"
      estimated_price: 0.45 # Calculated based on resolution

    - name: "Seedance-Lite"
      resolution: "512p"
      duration: "5s"
      price_per_million_tokens: 1.8
      token_formula: "(height x width x FPS x duration) / 1024"
      estimated_price: 0.10 # Calculated based on resolution

  kling:
    master:
    - name: "Kling-Master"
      duration: "5s"
      price_per_video: 1.40
      additional_second_price: 0.28

    - name: "Kling-Master"
      duration: "10s"
      price_per_video: 2.80 # 1.40 + (5 * 0.28)
      notes: "Base 5s + 5 additional seconds"

    - name: "Kling-Master"
      duration: "15s"
      price_per_video: 4.20 # 1.40 + (10 * 0.28)
      notes: "Base 5s + 10 additional seconds"

  veo2:
  - name: "Veo2"
    duration: "5s"
    price_per_video: 2.50
    additional_second_price: 0.50
    max_duration: "8s"

  - name: "Veo2"
    duration: "8s"
    price_per_video: 4.00 # 2.50 + (3 * 0.50)
    notes: "Base 5s + 3 additional seconds"

  veo3:
    standard:
      with_sound:
      - name: "Veo3-Sound"
        audio: true
        price_per_second: 0.75
        example_5s_video: 3.75
        example_10s_video: 7.50
        example_15s_video: 11.25

      muted:
      - name: "Veo3-Mute"
        audio: false
        price_per_second: 0.50
        example_5s_video: 2.50
        example_10s_video: 5.00
        example_15s_video: 7.50

    fast:
      with_sound:
      - name: "Veo3-Fast-Sound"
        audio: true
        price_per_second: 0.40
        example_5s_video: 2.00
        example_10s_video: 4.00
        example_15s_video: 6.00

      muted:
      - name: "Veo3-Fast-Mute"
        audio: false
        price_per_second: 0.27
        example_5s_video: 1.35
        example_10s_video: 2.70
        example_15s_video: 4.05

  wan:
    turbo:
    - name: "WAN-v2.2-Turbo"
      resolution: "720p"
      price_per_video: 0.10
      notes: "Fixed price per video"

    - name: "WAN-v2.2-Turbo"
      resolution: "580p"
      price_per_video: 0.075
      notes: "Fixed price per video"

    - name: "WAN-v2.2-Turbo"
      resolution: "480p"
      price_per_video: 0.05
      notes: "Fixed price per video"

    standard:
    - name: "WAN-v2.2-Standard"
      price_per_frame: 0.0024

  framepack:
  - name: "Framepack"
    resolution: "480p"
    duration: "5s"
    price_per_frame: 0.001
    notes: "Fixed price per video"

  - name: "Framepack-F1"
    resolution: "480p"
    duration: "5s"
    price_per_video: 0.10
    notes: "Fixed price per video"

